[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
asyncio_mode = strict

markers =
    unit: Pruebas unitarias de logica pura y aislamiento de I/O
    integration: Pruebas de integracion, contratos e idempotencia

addopts =
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=lcov:coverage-python.info
    --cov-report=html:coverage_html

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
