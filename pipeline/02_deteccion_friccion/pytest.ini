[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Pruebas unitarias de logica pura y aislamiento de I/O
    integration: Pruebas de integracion del pipeline punta a punta, con datos sinteticos en memoria

addopts =
    --cov=modulo
    --cov=ingesta
    --cov=preprocesamiento
    --cov-branch
    --cov-report=term-missing
    --cov-report=lcov:reports/coverage-python.info
    --cov-report=html:reports/coverage_html
    --cov-report=json:reports/coverage.json
    --html=reports/pytest_report.html
    --self-contained-html

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
