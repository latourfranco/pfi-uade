[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    unit: Pruebas unitarias de logica pura y aislamiento de I/O
    integration: Pruebas de integracion, emulacion de navegador y contratos

addopts = 
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=lcov:coverage-python.info
    --cov-report=html:coverage_html

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
