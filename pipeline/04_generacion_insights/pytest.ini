[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    unit: Pruebas unitarias aisladas de I/O
    integration: Pruebas de integración sobre la API FastAPI

addopts = 
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=lcov:coverage-python.info
    --cov-report=html:coverage_html
